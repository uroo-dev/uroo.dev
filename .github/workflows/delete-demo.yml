name: Delete Demo

# Dipicu oleh admin dashboard via GitHub repository_dispatch
on:
  repository_dispatch:
    types: [delete-demo]

permissions:
  contents: write
  id-token: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout repo utama (uroo.dev)
      - name: Checkout uroo.dev repo
        uses: actions/checkout@v4
        with:
          repository: uroo-dev/uroo.dev
          ref: main
          token: ${{ github.token }}
          path: catalog-repo

      # 2. Hapus entri demo dari demos.json
      - name: Remove demo from catalog
        working-directory: catalog-repo
        env:
          DEL_PROJECT: ${{ github.event.client_payload.project }}
          DEL_TITLE: ${{ github.event.client_payload.title }}
        run: |
          [ -f "demos.json" ] || echo '[]' > demos.json

          python3 - <<'PY'
          import json, os

          project = os.environ.get("DEL_PROJECT", "").strip()
          title = os.environ.get("DEL_TITLE", "").strip() or project

          if not project:
              print("::error::project kosong, tidak ada yang dihapus")
              exit(1)

          with open("demos.json", "r") as f:
              try:
                  demos = json.load(f)
              except json.JSONDecodeError:
                  demos = []

          before = len(demos)
          demos = [d for d in demos if d.get("project") != project]
          removed = before - len(demos)

          if removed == 0:
              print(f"Demo '{project}' tidak ditemukan di catalog — tidak ada yang diubah.")
          else:
              print(f"Menghapus {removed} entri demo '{project}' dari catalog.")

          with open("demos.json", "w") as f:
              json.dump(demos, f, indent=2, ensure_ascii=False)
              f.write("\n")
          PY

      - name: Commit catalog update
        working-directory: catalog-repo
        run: |
          git config user.name "uroo dev"
          git config user.email "uroprasetyo@gmail.com"
          git add demos.json
          git diff --cached --quiet && { echo "Tidak ada perubahan demos.json"; exit 0; }
          git commit -m "delete: remove demo ${{ github.event.client_payload.project }} from catalog"
          git push origin main

      # 3. Hapus project Cloudflare Pages (subdomain + DNS diurus otomatis)
      - name: Delete Cloudflare Pages project
        run: |
          PROJECT="${{ github.event.client_payload.project }}"
          ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          API_TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}"

          echo "Menghapus project Pages '${PROJECT}'"

          CHECK=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/pages/projects/${PROJECT}" \
            -H "Authorization: Bearer ${API_TOKEN}" \
            -H "Content-Type: application/json")

          EXISTS=$(echo "$CHECK" | python3 -c "import sys,json; d=json.load(sys.stdin); print('yes' if d.get('success') else 'no')")

          if [ "$EXISTS" = "yes" ]; then
            RESULT=$(curl -s -X DELETE "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/pages/projects/${PROJECT}" \
              -H "Authorization: Bearer ${API_TOKEN}" \
              -H "Content-Type: application/json")
            echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print('Project Pages dihapus:', d.get('success'), (d.get('errors') or [{}])[0].get('message','') if not d.get('success') else '')"
          else
            echo "Project Pages '${PROJECT}' tidak ditemukan — sudah tidak ada."
          fi